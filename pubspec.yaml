name: clean_architecture_linter
description: A comprehensive analysis_server_plugin that automatically enforces Clean Architecture principles in Flutter projects with Riverpod state management.
version: 2.4.0
repository: https://github.com/ittae/clean_architecture_linter
homepage: https://github.com/ittae/clean_architecture_linter
documentation: https://github.com/ittae/clean_architecture_linter/blob/main/README.md
issue_tracker: https://github.com/ittae/clean_architecture_linter/issues

topics:
  - clean-architecture
  - lint
  - custom-lint
  - linter
  - static-analysis

environment:
  sdk: '^3.11.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  # analyzer 14 plugin-host line. analysis_server_plugin 0.3.20 fixed the
  # "dart analyze could spin indefinitely" hang that kept 2.4.x on 0.3.15.
  # 0.3.20 pins analyzer 14.1.0 exactly, so the analyzer range below resolves
  # to 14.1.0 today and is kept open only for the next ASP bump. riverpod_lint
  # coexistence in the plugin synthetic package needs riverpod_lint 3.1.9
  # (analyzer >=13 <15, Dart >=3.13.0); older 3.1.x pin analyzer 13.
  analyzer: ">=14.1.0 <15.0.0"
  analysis_server_plugin: ">=0.3.20 <0.3.21"
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
