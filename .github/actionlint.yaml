# actionlint 설정 — 자체 호스팅 러너 라벨 + 선택적 shellcheck ignore.
# shellcheck 전면 ignore 금지: 이슈 코드 단위로만 억제한다.
self-hosted-runner:
  labels:
    - ittae
    - ittae-2
paths:
  .github/workflows/claude-code-review.yml:
    ignore:
      # GITHUB_OUTPUT / 환경 변수 확장 패턴에서 반복되는 노이즈 (info)
      - 'shellcheck reported issue in this script: SC2086:.*'
      # 의도적 single-quote (GH expression 보호) (info)
      - 'shellcheck reported issue in this script: SC2016:.*'
      # sed vs ${var//}/ 스타일 제안 (style)
      - 'shellcheck reported issue in this script: SC2001:.*'
      # 개별 >> redirect 스타일 제안 (style)
      - 'shellcheck reported issue in this script: SC2129:.*'
