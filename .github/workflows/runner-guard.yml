name: Runner guard

# Public repository. Hosted minutes are free, and a fork pull request must not
# reach the org self-hosted runner. This file does not call the private reusable
# workflow: GitHub rejects that call before any job starts ("public repositories
# can only access public workflows"). Private repositories install the reusable
# caller instead.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  runner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm this caller is only for a public repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "private repository must call the org runner-guard reusable, not this public caller" >&2
            exit 1
          fi
          echo "public repository: hosted runners stay on GitHub"
