name: Publish to pub.dev

# This package's pub.dev GitHub publishing config allows **tag push only**.
# workflow_dispatch is rejected by pub.dev ("not allowed from workflow_dispatch").
# Do not rely on workflow_call from branch-push callers either (OIDC inherits push/branch).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write

jobs:
  # Run all quality checks before publishing
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: 'stable'

    - name: Install dependencies
      run: dart pub get

    - name: Verify dependencies
      run: dart pub deps

    - name: Run analyzer
      run: dart analyze --fatal-warnings

    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Run tests
      run: dart test

    - name: Check pub publishing (dry run)
      # analysis_server_plugin mandates an entrypoint at lib/main.dart, which
      # triggers one unavoidable pub warning ("name 'main' should match the
      # package name"). Allow exactly that warning; fail on anything else.
      # (Without this, `dart pub publish --dry-run` exits 65 on the warning and
      # blocks the OIDC publish job — see CHANGELOG 2.0.x / matches ci.yml.)
      run: |
        output="$(dart pub publish --dry-run 2>&1 || true)"
        echo "$output"
        unexpected="$(printf '%s\n' "$output" | grep -E '^\* ' | grep -v 'lib/main.dart' || true)"
        if [ -n "$unexpected" ] || printf '%s\n' "$output" | grep -qE 'following error|Package has [0-9]+ error'; then
          echo "::error::Unexpected pub publish warnings/errors (see output above)."
          exit 1
        fi
        echo "OK: clean, or only the expected asp lib/main.dart naming warning."

  # Publish only if tests pass
  publish:
    needs: test
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  # After pub.dev accepts the version, ask each Flutter app that pins this
  # package to raise its floor (repository_dispatch). The consumer list lives in
  # the private ittae/.github (tools/cal_consumers.txt), and this public log
  # prints counts only, never a consumer name. Prerelease tags are skipped.
  notify-consumers:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
    - name: Resolve release version
      id: release
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        if printf '%s' "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
          echo "version=$version" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::$TAG is not a release x.y.z tag; consumers are not notified"
        fi

    - name: Wait until pub.dev serves the version
      if: steps.release.outputs.version != ''
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        url="https://pub.dev/api/packages/clean_architecture_linter/versions/$VERSION"
        for attempt in $(seq 1 20); do
          if curl -fsS -o /dev/null "$url"; then
            echo "pub.dev serves $VERSION"
            exit 0
          fi
          echo "pub.dev does not serve $VERSION yet (attempt $attempt/20)"
          sleep 15
        done
        echo "::error::pub.dev did not serve $VERSION within 5 minutes"
        exit 1

    - name: Dispatch to consumers
      if: steps.release.outputs.version != ''
      env:
        GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -uo pipefail
        if ! list="$(gh api -H 'Accept: application/vnd.github.raw' \
            repos/ittae/.github/contents/tools/cal_consumers.txt 2>/dev/null)"; then
          echo "::error::RELEASE_PLEASE_TOKEN cannot read the consumer list in ittae/.github"
          exit 1
        fi
        payload="$(jq -nc --arg v "$VERSION" \
          '{event_type: "clean-architecture-linter-published",
            client_payload: {package: "clean_architecture_linter", version: $v}}')"
        total=0
        failed=0
        while IFS= read -r line; do
          repo="${line%%#*}"
          repo="${repo//[[:space:]]/}"
          [ -n "$repo" ] || continue
          echo "::add-mask::$repo"
          total=$((total + 1))
          if [[ ! "$repo" =~ ^ittae/[A-Za-z0-9_.-]+$ ]] \
            || ! gh api -X POST "repos/$repo/dispatches" --input - <<<"$payload" >/dev/null 2>&1; then
            failed=$((failed + 1))
            echo "::error::consumer $total: dispatch failed"
          fi
        done <<<"$list"
        echo "dispatched $((total - failed))/$total consumers for $VERSION"
        if [ "$total" -eq 0 ] || [ "$failed" -gt 0 ]; then
          exit 1
        fi
