name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: 'stable'

    - name: Print Dart SDK version
      run: dart --version

    - name: Install dependencies
      run: dart pub get

    - name: Verify dependencies
      run: dart pub deps

    - name: Run analyzer
      run: dart analyze

    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Run tests
      run: dart test

    - name: Check pub publishing
      # analysis_server_plugin mandates an entrypoint at lib/main.dart, which
      # triggers one unavoidable pub warning ("name 'main' should match the
      # package name"). Allow exactly that warning; fail on anything else.
      run: |
        output="$(dart pub publish --dry-run 2>&1 || true)"
        echo "$output"
        # Validation issues are listed as lines beginning with "* " (the file
        # tree uses box-drawing chars, so it is not matched). Drop the known
        # lib/main.dart naming issue; anything else (or an explicit error) fails.
        unexpected="$(printf '%s\n' "$output" | grep -E '^\* ' | grep -v 'lib/main.dart' || true)"
        if [ -n "$unexpected" ] || printf '%s\n' "$output" | grep -qE 'following error|Package has [0-9]+ error'; then
          echo "::error::Unexpected pub publish warnings/errors (see output above)."
          exit 1
        fi
        echo "OK: clean, or only the expected asp lib/main.dart naming warning."

  plugin-diagnostics:
    # Regression guard for ITT-1677 / ITT-1836: proves the analysis_server_plugin
    # still emits diagnostics through `dart analyze` (the recommended consumer
    # path). `flutter analyze` silently drops these diagnostics, so this gate
    # deliberately uses `dart analyze`. See
    # docs/analysis/FLUTTER_ANALYZE_PLUGIN_LOSS.md
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Dart-less fast-fail: missing/unknown slices fail before dart-lang/setup-dart.
    - name: Verify slice contract declarations
      run: bash tools/verify_analyze_parity.sh --contracts-only

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: 'stable'

    - name: Verify plugin diagnostics via dart analyze
      run: bash tools/verify_analyze_parity.sh

  no-wait-caller:
    # 1st-line PR gate: fail if a GHA AI-review wait caller
    # (pr-review.yml / .yaml etc.) is restored. Wait callers were removed
    # 2026-08-29; AI review is poller-only. Do not revive HIGH_RISK_PATHS
    # lockstep against a deleted local wait workflow.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify no GHA AI-review wait caller
      run: bash tools/verify_no_wait_caller.sh


  host-sot-tools:
    # Regression guard for tools/ai_review_sot.py + resolve_ai_review_model.py
    # + resolve_ai_review_engine_order.py (H1–H6 + engine-order units).
    # Python-only; no Dart SDK required. Discover all tools/tests/test_*.py.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run host SoT helper units
      run: |
        if [ -d tools/tests ] && ls tools/tests/test_*.py >/dev/null 2>&1; then
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
        else
          echo "No tools/tests — skip"
        fi

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: 'stable'

    - name: Install dependencies
      run: dart pub get

    - name: Install coverage tools
      run: dart pub global activate coverage

    - name: Run tests with coverage
      run: dart test --coverage=coverage

    - name: Convert coverage to LCOV
      run: dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
