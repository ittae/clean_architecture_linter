name: clean_architecture_linter_poc_v2
description: PoC package for the analysis_server_plugin based v2 implementation.
version: 2.0.0-dev.0
publish_to: none

# Historical analyzer 13 proof-of-concept, kept as-is on purpose. It is not a
# consumer of the package and is outside the verification gates; the shipped
# package and its fixtures (poc_v2/example, poc_v2/consumer_riverpod_lint,
# example/) are on the analyzer 14 line.
environment:
  sdk: ^3.10.0

dependencies:
  analyzer: 13.0.0
  analyzer_plugin: 0.14.9
  analysis_server_plugin: ^0.3.15

dev_dependencies:
  lints: ^6.1.0
